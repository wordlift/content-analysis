[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resolve-pipeline"
version = "0.1.2"
description = "Open content-analysis pipeline with a pluggable entity resolver: extract, retrieve, resolve or NIL."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://wordlift.io/resolve/"
Repository = "https://github.com/wordlift/content-analysis"
Issues = "https://github.com/wordlift/content-analysis/issues"

[project.optional-dependencies]
ner = ["gliner>=0.2.27", "torch>=2.4"]
html = []  # kept for compatibility: the HTML helper needs the standard library only since 0.1.2
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[tool.setuptools.packages.find]
include = ["resolve_pipeline*"]

[tool.setuptools.package-data]
resolve_pipeline = ["labels.yml", "py.typed"]

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["clients"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E731"]  # one-line lambda handlers keep the mocked transports in tests readable

[tool.mypy]
files = ["resolve_pipeline"]
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["gliner", "gliner.*", "torch"]  # the optional `ner` extra
ignore_missing_imports = true
